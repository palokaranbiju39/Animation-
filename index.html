<script>
/* ==================================================================
   helpers
   ================================================================== */
const NS='http://www.w3.org/2000/svg';
const E={};const $=id=>E[id]||(E[id]=document.getElementById(id));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-clamp(t),3);
const eio=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const sm=(a,b,t)=>eio((t-a)/(b-a));
function RND(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mixC(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],t)).toString(16).padStart(2,'0')).join('')}
const T=(id,tr)=>$(id).setAttribute('transform',tr);
const A=(id,k,v)=>$(id).setAttribute(k,v);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const f1=v=>(+v).toFixed(1);

/* noise texture generated in code */
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);const r=RND(5);
 for(let i=0;i<65536;i++){const v=90+r()*120;d.data[i*4]=v;d.data[i*4+1]=v*.9;d.data[i*4+2]=v*.8;d.data[i*4+3]=60+r()*110}
 x.putImageData(d,0,0);$('noiseImg').setAttribute('href',c.toDataURL())})();

/* ==================================================================
   timing — taken from the voiceover (silence detection)
   ================================================================== */
const TS={A:0,B:6.56,C:15.34,D:23.34,D5:28.29,D6:37.2,E:40.0,END:42.0};

/* ==================================================================
   character : same man in every scene
   ================================================================== */
function manSVG(P){
  const R=RND(11);let hair='',hair2='',hl='';
  for(let i=0;i<54;i++){const a=Math.PI+Math.PI*(i/53);const rx=66+R()*10,ry=80+R()*10;
    hair+=`<circle cx="${f1(Math.cos(a)*rx)}" cy="${f1(-742+Math.sin(a)*ry)}" r="${f1(19+R()*11)}"/>`}
  for(let i=0;i<46;i++){const a=Math.PI*(1.12+0.76*R());const rr=.35+R()*.65;
    hair2+=`<circle cx="${f1(Math.cos(a)*(rr*62))}" cy="${f1(-792+Math.sin(a)*(rr*52))}" r="${f1(14+R()*10)}"/>`}
  for(let i=0;i<26;i++){const a=Math.PI*1.1+Math.PI*0.8*R();const rr=.7+R()*.4;
    hl+=`<circle cx="${f1(Math.cos(a)*70*rr)}" cy="${f1(-742+Math.sin(a)*88*rr-4)}" r="${f1(4+R()*5)}" fill="#3b2f27" opacity=".7"/>`}
  const SKIN='#c68a5e',SKD='#a86d47',NAVY='#272b3a';
  const arm=(s,id)=>`<g transform="translate(${s*112} -632)"><g id="${P}u${id}">
      <rect x="-29" y="-14" width="58" height="176" rx="28" fill="${NAVY}"/>
      <rect x="-29" y="-14" width="22" height="176" rx="11" fill="#3a4056" opacity=".55"/>
      <g transform="translate(0 150)"><g id="${P}f${id}">
        <rect x="-26" y="-6" width="52" height="46" rx="14" fill="#323850"/>
        <rect x="-21" y="30" width="42" height="104" rx="18" fill="${SKIN}"/>
