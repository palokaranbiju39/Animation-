<body>
<div id="stage">
<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1">
    <stop id="sk0" offset="0" stop-color="#1f2350"/><stop id="sk1" offset=".28" stop-color="#5b3a7a"/>
    <stop id="sk2" offset=".55" stop-color="#c4527a"/><stop id="sk3" offset=".8" stop-color="#ff8a4a"/><stop id="sk4" offset="1" stop-color="#ffd08a"/>
  </linearGradient>
  <radialGradient id="sunHalo"><stop offset="0" stop-color="#fffbe6"/><stop offset=".12" stop-color="#ffeab0" stop-opacity=".95"/><stop offset=".35" stop-color="#ffb866" stop-opacity=".5"/><stop offset=".7" stop-color="#ff8a4a" stop-opacity=".15"/><stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/></radialGradient>
  <radialGradient id="sunDisc"><stop offset="0" stop-color="#fffdf0"/><stop offset=".7" stop-color="#ffefb8"/><stop offset="1" stop-color="#ffd27a"/></radialGradient>
  <linearGradient id="seaG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffb27a"/><stop offset=".08" stop-color="#d98b7f"/><stop offset=".25" stop-color="#6d7f98"/><stop offset=".6" stop-color="#2f6f86"/><stop offset="1" stop-color="#1f5a70"/>
  </linearGradient>
  <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3c093"/><stop offset=".5" stop-color="#cba274"/><stop offset="1" stop-color="#a98056"/></linearGradient>
  <linearGradient id="wetG" gradientUnits="userSpaceOnUse" x1="0" y1="1400" x2="0" y2="1700"><stop offset="0" stop-color="#4a3322" stop-opacity=".62"/><stop offset=".6" stop-color="#5b4130" stop-opacity=".38"/><stop offset="1" stop-color="#6b4f3a" stop-opacity="0"/></linearGradient>
  <linearGradient id="waterOverG" gradientUnits="userSpaceOnUse" x1="0" y1="1500" x2="0" y2="1820"><stop offset="0" stop-color="#7fd6cc" stop-opacity="0"/><stop offset=".35" stop-color="#6fcfc6" stop-opacity=".46"/><stop offset="1" stop-color="#a8ece0" stop-opacity=".62"/></linearGradient>
  <linearGradient id="trunkG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a3427"/><stop offset=".5" stop-color="#2b1e18"/><stop offset="1" stop-color="#1b130f"/></linearGradient>
  <linearGradient id="furG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fffdf8"/><stop offset=".6" stop-color="#ece6da"/><stop offset="1" stop-color="#d4cbbd"/></linearGradient>
  <linearGradient id="redG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ef5c54"/><stop offset=".5" stop-color="#d9363c"/><stop offset="1" stop-color="#a42027"/></linearGradient>
  <linearGradient id="blkG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38363f"/><stop offset=".5" stop-color="#1b1a21"/><stop offset="1" stop-color="#0d0c10"/></linearGradient>
  <linearGradient id="rpG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e0803f"/><stop offset=".55" stop-color="#bb5a24"/><stop offset="1" stop-color="#8c3f17"/></linearGradient>
  <radialGradient id="scrimG" gradientUnits="userSpaceOnUse" cx="110" cy="470" r="760"><stop offset="0" stop-color="#000" stop-opacity=".42"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <linearGradient id="shirtG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fbeed6"/><stop offset=".55" stop-color="#e9dec6"/><stop offset="1" stop-color="#c3b392"/></linearGradient>
  <linearGradient id="shirtG2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3e6cc"/><stop offset="1" stop-color="#bfae8c"/></linearGradient>
  <linearGradient id="trouG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#444650"/><stop offset="1" stop-color="#22242b"/></linearGradient>
  <linearGradient id="skinG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6d3b0"/><stop offset="1" stop-color="#dba87f"/></linearGradient>
  <linearGradient id="skinG2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e2b48a"/><stop offset="1" stop-color="#b98560"/></linearGradient>
  <linearGradient id="sageG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b7c9a4"/><stop offset="1" stop-color="#7f9770"/></linearGradient>
  <radialGradient id="phoneGlow"><stop offset="0" stop-color="#e3f1ff" stop-opacity=".9"/><stop offset="1" stop-color="#e3f1ff" stop-opacity="0"/></radialGradient>
  <radialGradient id="vig" cx=".5" cy=".5" r=".78"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#1a0a14" stop-opacity=".5"/></radialGradient>
  <radialGradient id="flashG"><stop offset="0" stop-color="#fff6d8"/><stop offset="1" stop-color="#ffcf8a"/></radialGradient>
  <linearGradient id="hazeG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd7a0" stop-opacity="0"/><stop offset=".5" stop-color="#ffc58a" stop-opacity=".55"/><stop offset="1" stop-color="#ffc58a" stop-opacity="0"/></linearGradient>
  <linearGradient id="rayG" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff0c0" stop-opacity=".22"/><stop offset="1" stop-color="#fff0c0" stop-opacity="0"/></linearGradient>
  <filter id="b4" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
  <filter id="b8" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  <filter id="b18" x="-50%" y="-80%" width="200%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>

  <clipPath id="frontClip"><rect x="-100" y="1500" width="1300" height="500"/></clipPath>
  <clipPath id="skyClip"><rect x="0" y="0" width="1080" height="1012"/></clipPath>
</defs>

<g id="cam">
  <!-- SKY -->
  <rect x="-100" y="-300" width="1280" height="1330" fill="url(#skyG)"/>

  <circle id="sunHalo" cx="300" cy="900" r="520" fill="url(#sunHalo)"/>
  <g id="clouds"></g>
  <circle id="sunDisc" cx="300" cy="900" r="66" fill="url(#sunDisc)"/>
  <rect x="-100" y="900" width="1280" height="150" fill="url(#hazeG)"/>
  <g id="boat" transform="translate(820 1008)"></g>
  <g id="crowsBack"></g>
  <!-- SEA -->
  <rect x="-100" y="1010" width="1280" height="520" fill="url(#seaG)"/>

  <g id="waves" fill="none"></g>
  <g id="refl"></g>
  <g id="glints"></g>
  <g id="palmsBack"></g>
  <!-- SAND -->
  <path id="sandP" d="" fill="url(#sandG)"/>
  <path id="sandNoise" d="" fill="url(#noiseP)" opacity=".28"/>
  <path id="wetP" d="" fill="url(#wetG)"/>
  <ellipse id="wetRefl" cx="300" cy="1500" rx="150" ry="50" fill="#ffc58a" opacity=".22" filter="url(#b8)"/>
  <g id="foamBack" fill="none" stroke-linecap="round"></g>
  <g id="sandDeco"></g>
  <g id="shadows"></g>
  <g id="prints" fill="#7a5a40" opacity=".35"></g>
  <!-- FIGURES -->
  <g id="otherG" opacity="0"></g>
  <g id="seatG" opacity="0"></g>
  <g id="standRear"></g>

  <!-- FRONT WATER -->
  <g clip-path="url(#frontClip)"><path id="waterOver" d="" fill="url(#waterOverG)"/><g id="foamFront" fill="none" stroke-linecap="round"></g></g>
  <g id="palmsFront"></g>
  <g id="grassFront"></g>
  <g id="crowsFront"></g>
  <g id="motes"></g>
  <rect id="warmOv" x="-100" y="-300" width="1280" height="2300" fill="#ff9a4a" opacity="0" style="mix-blend-mode:soft-light"/>
  <rect id="duskOv" x="-100" y="-300" width="1280" height="2300" fill="#2a1f4a" opacity="0"/>
</g>
<rect width="1080" height="1920" fill="url(#vig)"/>
<rect id="flash" width="1080" height="1920" fill="url(#flashG)" opacity="0"/>
<rect x="0" y="0" width="1080" height="1300" fill="url(#scrimG)"/>
<g id="ui" filter="url(#tshadow)"></g>
</svg>
</div>

<script>
/* ======================== helpers ======================== */
const NS='http://www.w3.org/2000/svg';
const E={};const $=id=>E[id]||(E[id]=document.getElementById(id));
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const eio=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const eo=t=>1-Math.pow(1-clamp(t),3);
const sm=(a,b,t)=>eio((t-a)/(b-a));
function RND(seed){let s=seed;return()=>(s=(s*16807)%2147483647)/2147483647}
function hex(c){return[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)]}
function mixC(a,b,t){const A=hex(a),B=hex(b);return'#'+A.map((v,i)=>Math.round(lerp(v,B[i],clamp(t))).toString(16).padStart(2,'0')).join('')}
const A_=(id,k,v)=>(typeof id==='string'?$(id):id).setAttribute(k,v);
const TR=(id,v)=>A_(id,'transform',v);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
const f1=v=>(+v).toFixed(1);
function bez2(p0,p1,p2,t){const u=1-t;return[u*u*p0[0]+2*u*t*p1[0]+t*t*p2[0],u*u*p0[1]+2*u*t*p1[1]+t*t*p2[1]]}
function bez3(p0,p1,p2,p3,t){const u=1-t;return[u*u*u*p0[0]+3*u*u*t*p1[0]+3*u*t*t*p2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*p1[1]+3*u*t*t*p2[1]+t*t*t*p3[1]]}
(function(){const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d');const d=x.createImageData(256,256);const r=RND(5);
 for(let i=0;i<65536;i++){const v=70+r()*140;d.data[i*4]=v;d.data[i*4+1]=v*.88;d.data[i*4+2]=v*.72;d.data[i*4+3]=40+r()*120}
 x.putImageData(d,0,0);$('noiseImg').setAttribute('href',c.toDataURL())})();

/* ======================== timing (voiceover onsets) ======================== */
const TM=window.TIMING;const ONSET=TM.L,SPEECH_END=TM.speechEnd,DUR=+(TM.speechEnd+1.5).toFixed(2);
const spanL=i=>(i<5?ONSET[i+1]:SPEECH_END)-ONSET[i];const AL=(i,f)=>ONSET[i]+f*spanL(i);
const AN={phone:AL(0,.5),turn0:AL(0,.72),flash:AL(1,.45),wave:AL(3,.4)};AN.turn1=AN.turn0+.6;AN.peak=AN.wave+1.4;AN.swap=AN.peak;AN.waveEnd=AN.wave+5.8;AN.late0=AL(4,.85);AN.late1=AL(5,.45);window.AN=AN;
const HZ=1010, SUNX=300;

/* ======================== sky, clouds, rays, boat ======================== */
(function(){const R=RND(9);
 const cl=$('clouds');
 const cols=[['#9d4f86',.5,230,520,38],['#c4527a',.5,300,640,30],['#ff9a5a',.55,380,780,26],['#ffb878',.6,420,860,22],['#ffd9a0',.55,460,930,16]];
 cols.forEach((c,ci)=>{for(let i=0;i<4;i++){const g=el('g',{'data-ci':ci,'data-s':R()},cl);
   for(let k=0;k<4;k++)el('ellipse',{cx:k*85-120+R()*30,cy:R()*10,rx:130+R()*90,ry:c[4]*(.6+R()*.5),fill:c[0],opacity:c[1]},g);
   g.dataset.y=c[2]+R()*(c[3]-c[2])*.35+ci*28}});
 const rays=$('rays');for(let i=0;i<7;i++)el('polygon',{points:`${SUNX-8},900 ${SUNX+8},900 ${SUNX+160+i*40},-200 ${SUNX-200+i*10},-200`,fill:'url(#rayG)',transform:`rotate(${-38+i*13} ${SUNX} 900)`,opacity:.35},rays);
 // fishing boat
 $('boat').innerHTML=`<path d="M-44 0Q-38 10 -20 12H26Q40 8 48 -4L40 -2L34 -4H-30L-44 -4Z" fill="#1d1420"/><path d="M0 -4V-52" stroke="#1d1420" stroke-width="2.5"/><path d="M0 -50Q22 -30 30 -6H0Z" fill="#241826"/><path d="M-3 -46Q-20 -26 -28 -6H-3Z" fill="#2b1b2a"/>`;
})();

/* ======================== waves, reflection ======================== */
const waveRows=[],reflBars=[],glints=[];
(function(){const R=RND(17);const g=$('waves');
 for(let i=0;i<18;i++){const y=HZ+6+Math.pow(i/17,1.85)*410;
   waveRows.push({y,a:1.4+i*.5,k:.012+(17-i)*.0006+R()*.002,sp:.5+R()*.5,ph:R()*6,
     p1:el('path',{stroke:'#fff3e0','stroke-width':1.6+i*.22,opacity:.2},g),p2:el('path',{stroke:'#12394a','stroke-width':1.8+i*.3,opacity:.16},g)})}
 const gr=$('refl');
 for(let i=0;i<48;i++){const segs=[];for(let j=0;j<3;j++)segs.push(el('rect',{fill:'#ffe6b0',rx:1.5},gr));reflBars.push({i,segs})}
 const gl=$('glints');for(let i=0;i<26;i++)glints.push({s:R(),p:el('path',{d:'M0 -9L2 -2L9 0L2 2L0 9L-2 2L-9 0L-2 -2Z',fill:'#fff'},gl)});
})();
function updSea(t,sunY){
 waveRows.forEach((w,i)=>{let d1='',d2='';for(let x=-40;x<=1120;x+=40){const y=w.y+w.a*Math.sin(x*w.k+t*w.sp*1.4+w.ph)+Math.sin(x*.02-t*.9+i)*w.a*.3;d1+=(x<-39?'M':'L')+f1(x)+' '+f1(y);d2+=(x<-39?'M':'L')+f1(x)+' '+f1(y+3+i*.3)}
   w.p1.setAttribute('d',d1);w.p2.setAttribute('d',d2)});
 const sx=SUNX;const bright=clamp(1-(sunY-880)/220);
 reflBars.forEach(b=>{const i=b.i,y=HZ+3+Math.pow(i/47,1.75)*400,h=1.8+i*.2,bw=26+i*9.5;
   b.segs.forEach((s,j)=>{const cx=sx+(j-1)*bw*.52+Math.sin(t*1.4+i*.9+j*2.1)*bw*.1,w=bw*(.2+.2*Math.abs(Math.sin(t*2.1+i*1.3+j*3)));
     const op=(.9-i*.011)*(.5+.5*Math.sin(t*3.2+i*1.7+j))*bright;
     s.setAttribute('x',f1(cx-w/2));s.setAttribute('y',f1(y+Math.sin(t*1.7+i+j)*1.2));s.setAttribute('width',f1(w));s.setAttribute('height',f1(h));s.setAttribute('opacity',f1(clamp(op)))})});
 glints.forEach((g,i)=>{const lt=(t*.5+g.s)%1;const y=HZ+14+Math.pow(g.s,1.4)*380,x=sx+(Math.sin(g.s*40)*(30+(y-HZ)*.55));
   g.p.setAttribute('transform',`translate(${f1(x)} ${f1(y)}) scale(${f1(Math.sin(lt*Math.PI)*(.6+g.s)*bright)})`)});
 A_('seaGlow','opacity',f1(.5*bright+.1));A_('wetRefl','opacity',f1(.26*bright));
}

/* ======================== shoreline / sand / foam ======================== */
const SHORE0=1415,BIG=330;
function swell(t){const p=((t+1.6)/6.4)%1;return p<.32?eio(p/.32):1-eio((p-.32)/.68)}
function surge(t){if(t<AN.wave||t>AN.waveEnd)return 0;if(t<AN.peak)return eo((t-AN.wave)/1.4);return 1-eio((t-AN.peak)/4.4)}
function late(t){return sm(AN.late0,AN.late1,t)}
function endWave(t){const t0=DUR-3.6;if(t<t0)return 0;return t<DUR-1.7?eo((t-t0)/1.9):1-eio((t-(DUR-1.7))/1.7)}
function shore(x,t){return SHORE0+(34+45*late(t))*swell(t)+BIG*surge(t)+158*endWave(t)+9*Math.sin(x*.011+t*.7)+5*Math.sin(x*.029-t*.9)+(x-540)*.018}
function wetBottom(x,t){let m=shore(x,t);for(let tau=t;tau>t-8&&tau>=0;tau-=.5){m=Math.max(m,shore(x,tau)+30-9*(t-tau))}return m}
const SX=[];for(let x=-60;x<=1140;x+=30)SX.push(x);
let foamBackEls=[],foamFrontEls=[];
(function(){const R=RND(23);
 [['foamBack',foamBackEls],['foamFront',foamFrontEls]].forEach(([id,arr])=>{const g=$(id);
   arr.push(el('path',{stroke:'#fffaf0','stroke-width':9,opacity:.9,'stroke-dasharray':'34 9 16 11 46 7 22 13'},g));
   arr.push(el('path',{stroke:'#fff','stroke-width':4,opacity:.7,'stroke-dasharray':'12 10 26 8 8 14'},g));
   for(let k=0;k<3;k++)arr.push(el('path',{stroke:'#fff','stroke-width':3-k*.6,opacity:.4,'stroke-dasharray':'18 12 8 16 30 10'},g));
   arr.push(el('path',{stroke:'#e8f6f0','stroke-width':18,opacity:.3,'stroke-dasharray':'60 40 90 50'},g))})
 // sand deco: shells, pebbles, ripples
 const sd=$('sandDeco');for(let i=0;i<46;i++){const x=R()*1080,y=1500+R()*400;el('ellipse',{cx:x,cy:y,rx:3+R()*8,ry:1.5+R()*3,fill:R()<.5?'#8d6a48':'#f3dbb4',opacity:.45},sd)}
 for(let i=0;i<7;i++){const x=R()*1000+40,y=1540+R()*350;el('path',{d:`M${x} ${y}q10 -14 22 0q-6 -4 -22 0z`,fill:'#f9ead0',stroke:'#c2a06f','stroke-width':1.2,opacity:.9},sd)}
})();
function updShore(t){
 let top='',bot='',wetB='',over='',overOn=false;
 SX.forEach((x,i)=>{const y=shore(x,t);top+=(i?'L':'M')+f1(x)+' '+f1(y);wetB+=' L'+f1(x)+' '+f1(wetBottom(x,t))});
 let sand=top+' L1140 1960 L-60 1960Z';A_('sandP','d',sand);A_('sandNoise','d',sand);
 // wet band : shore -> wetBottom
 let wet=top;for(let i=SX.length-1;i>=0;i--){wet+=' L'+f1(SX[i])+' '+f1(wetBottom(SX[i],t))}A_('wetP','d',wet+'Z');
 // water over (only where beyond 1500)
 let ov='M-60 1380';SX.forEach(x=>{ov+=' L'+f1(x)+' '+f1(Math.max(1380,shore(x,t)))});ov+=' L1140 1380Z';A_('waterOver','d',ov);
 const sur=surge(t);
 [[foamBackEls,1],[foamFrontEls,1]].forEach(([arr])=>{
   arr.forEach((p,idx)=>{let d='';const lag=idx<2?0:(idx<5?(idx-1)*.85:.4);const off=idx===5?-26:(idx>=2&&idx<5?0:(idx===1?8:0));
     SX.forEach((x,i)=>{const y=shore(x,t-lag)+off+(idx>=2&&idx<5?Math.sin(x*.05+idx)*3:0);d+=(i?'L':'M')+f1(x)+' '+f1(y)});p.setAttribute('d',d);
     const base=[.92,.72,.42,.3,.22,.3][idx];const dash=-(t*(idx===5?18:30)+idx*13);p.setAttribute('stroke-dashoffset',f1(dash));
     if(idx>=2&&idx<5){const adv=swell(t)-swell(t-lag);p.setAttribute('opacity',f1(clamp(base*(adv<0?1:0.15)*(1+sur))))}else p.setAttribute('opacity',f1(base))})});
 A_('foamFront','opacity',f1(clamp(.3+sur*1.2)));
}

/* ======================== palms ======================== */
const palms=[];
function palm(parent,x,y,h,lean,seed,col,hi,scale){
 const R=RND(seed);const g=el('g',{transform:`translate(${x} ${y}) scale(${scale||1})`},parent);
 const tx=lean,ty=-h;let L='',Rr='';const N=22;
 for(let i=0;i<=N;i++){const k=i/N;const[px,py]=bez3([0,0],[lean*.1,ty*.35],[tx*.75,ty*.7],[tx,ty],k);const w=lerp(24,10,k);L+=`${f1(px-w)},${f1(py)} `;Rr=`${f1(px+w)},${f1(py)} `+Rr}
 el('polygon',{points:L+Rr,fill:'url(#trunkG)'},g);
 for(let i=1;i<N;i+=1){const k=i/N;const[px,py]=bez3([0,0],[lean*.1,ty*.35],[tx*.75,ty*.7],[tx,ty],k);const w=lerp(24,10,k);el('path',{d:`M${f1(px-w)} ${f1(py)}Q${f1(px)} ${f1(py+5)} ${f1(px+w)} ${f1(py)}`,stroke:'#0f0a08','stroke-width':2,fill:'none',opacity:.5},g)}

 'അങ്ങനെ എപ്പഴോ… അയാളായി നമ്മുടെ ലോകം.',
 'ന്നിട്ട് ഒരു ദിവസം… വന്ന പോലെ തന്നെ പെട്ടെന്ന് അയാള് പോയി.',
 'ന്നാലും അയാള് എവിടെയായാലും സന്തോഷായിട്ടിരിക്കട്ടെ.',
 'അത്രയ്ക്ക് സ്നേഹിച്ചു പോയില്ലേ… ആ ഓർമ്മ അതങ്ങനെ കിടക്കട്ടെ.'];
const CAP_X=66,CAP_Y=352,CAP_LH=92,CAP_FS=70,CAP_MAXW=730;
const capWords=[];
function layoutCaptions(){
 const ui=$('ui');
 const title=el('text',{x:CAP_X,y:270,'font-size':33,'font-weight':700,fill:'#ffd9a0','letter-spacing':1},ui);title.textContent='അതങ്ങനെ കിടക്കട്ടെ';
 el('rect',{x:CAP_X,y:288,width:64,height:3,rx:1.5,fill:'#ffd9a0',opacity:.8},ui);
 const meas=el('text',{'font-size':CAP_FS,'font-weight':800,x:-2000,y:-2000},ui);
 const mw=s=>{meas.textContent=s;return meas.getComputedTextLength()};
 const sp=mw('അ അ')-mw('അഅ');
 LINES.forEach((ln,li)=>{
   const words=ln.split(' ');let rows=[[]],rw=0;
   words.forEach(w=>{const ww=mw(w);if(rw+ww>CAP_MAXW&&rows[rows.length-1].length){rows.push([]);rw=0}rows[rows.length-1].push({w,ww});rw+=ww+sp});
   const g=el('g',{opacity:0},ui);const items=[];let totalCh=0;words.forEach(w=>totalCh+=w.length);let acc=0;
   rows.forEach((row,ri)=>{let x=CAP_X;row.forEach(o=>{const t=el('text',{x:0,y:0,'font-size':CAP_FS,'font-weight':800,fill:'#fff3df'},g);t.textContent=o.w;
      const it={t,x,y:CAP_Y+ri*CAP_LH,c0:acc/totalCh};acc+=o.w.length;it.c1=acc/totalCh;items.push(it);x+=o.ww+sp})});
   capWords.push({g,items,li})});
 meas.remove();
}
function updCaps(t){
 capWords.forEach(c=>{const a=ONSET[c.li]-.05,b=c.li<5?ONSET[c.li+1]-.12:1e9;const end=c.li<5?ONSET[c.li+1]:SPEECH_END;
  const span=(end-ONSET[c.li])*.78;
  const lineOp=c.li<5?clamp((t-a)/.1)*(1-clamp((t-(b-.35))/.35)):clamp((t-a)/.1);
  c.g.setAttribute('opacity',t>=a-.01&&t<=b+.01?f1(lineOp):0);
  if(t<a||t>b)return;
  c.items.forEach(it=>{const ts=ONSET[c.li]+it.c0*span;const k=clamp((t-ts)/.35);const e=eo(k);
    it.t.setAttribute('transform',`translate(${f1(it.x)} ${f1(it.y+(1-e)*10)})`);it.t.setAttribute('opacity',f1(e))})})
}

/* ======================== state + timeline (all anchored to the voiceover's line onsets) ======================== */
const S={camK:1,camX:540,camY:960,warm:0,dusk:0,phone:0,phoneHold:0,smile:0,lid:0,brow:0,gx:0,gy:0,browLift:0,glow:0,flash:0,otherA:0,sunY:880};
const tl=gsap.timeline({paused:true,defaults:{ease:'power2.inOut'}});
const D_=(a,b)=>Math.max(.05,b-a);
// camera
tl.to(S,{camK:1.08,camX:586,camY:1040,duration:AN.turn0,ease:'power1.inOut'},0);
tl.to(S,{camK:1.5,camX:630,camY:1185,duration:D_(AN.turn0,AN.flash-.1),ease:'power2.inOut'},AN.turn0);
tl.to(S,{camK:1.2,camX:420,camY:1330,duration:.01},AN.flash);
tl.to(S,{camK:1.3,camX:650,camY:1260,duration:D_(AN.flash+.02,AN.wave-.3),ease:'power1.inOut'},AN.flash+.02);
tl.to(S,{camK:1.3,camX:655,camY:1255,duration:D_(AN.wave-.3,AN.peak+.5),ease:'none'},AN.wave-.3);
tl.to(S,{camK:1.7,camX:636,camY:1175,duration:D_(AN.peak+.5,AL(5,0)),ease:'power2.inOut'},AN.peak+.5);
tl.to(S,{camK:1.0,camX:540,camY:960,duration:D_(AL(5,.12),DUR-.5),ease:'power2.inOut'},AL(5,.12));
// sun sets slowly, dusk deepens
tl.to(S,{sunY:975,duration:DUR,ease:'none'},0);tl.to(S,{dusk:1,duration:DUR,ease:'none'},0);
// memory warmth + flash
tl.to(S,{warm:1,duration:.5},AN.flash);tl.to(S,{warm:0,duration:3.2},AN.wave+1.8);
tl.fromTo(S,{flash:0},{flash:.9,duration:.22,ease:'power2.out',immediateRender:false},AN.flash-.15);tl.to(S,{flash:0,duration:.7},AN.flash+.07);
// phone + expression
tl.to(S,{phone:1,phoneHold:1,duration:1.3,ease:'power2.out'},AN.phone);
tl.to(S,{phone:.1,duration:1.4},AL(4,0));
tl.to(S,{glow:.28,duration:1.0},AN.turn1);tl.to(S,{glow:0,duration:.8},AN.flash-.6);
tl.to(S,{smile:.62,duration:1.1},AN.turn1+.3);tl.to(S,{smile:.85,duration:1.2},AN.flash+1.0);tl.to(S,{smile:.7,duration:1.0},AL(2,.3));
tl.to(S,{smile:.1,duration:1.4},AN.wave+.5);
tl.to(S,{smile:-.55,brow:.9,lid:.35,duration:1.6},AN.peak+.7);
tl.to(S,{smile:-.2,brow:.45,lid:.28,duration:1.8},AL(4,.3));
tl.to(S,{smile:.18,brow:.05,lid:.18,duration:2.4,ease:'sine.inOut'},AL(4,.62));
tl.to(S,{gx:-3.2,gy:-.4,duration:.9},AL(4,.12));
tl.to(S,{lid:.12,smile:.22,duration:2.2},AL(5,.5));
tl.to(S,{otherA:1,duration:.7},AN.flash+.45);tl.to(S,{otherA:0,duration:1.4,ease:'power1.in'},AN.wave+.4);

/* ======================== per-frame procedure ======================== */
function proc(t){
 let k=S.camK,cx=clamp(S.camX,540/k,1080-540/k),cy=clamp(S.camY,960/k,1920-960/k);
 TR('cam',`translate(540 960) scale(${k.toFixed(4)}) translate(${f1(-cx)} ${f1(-cy)})`);
 const d=S.dusk,w=S.warm;
 const c0=mixC('#27306a','#0f1233',d),c1=mixC('#6a4a8e','#3b2a6a',d),c2=mixC('#d65f80','#a44a82',d),c3=mixC('#ff9a50','#e8704a',d),c4=mixC('#ffdc98','#ffb87a',d);
 A_('sk0','stop-color',mixC(c0,'#3a3f8a',w*.3));A_('sk1','stop-color',mixC(c1,'#a2559a',w*.5));A_('sk2','stop-color',mixC(c2,'#ff7a6a',w*.6));A_('sk3','stop-color',mixC(c3,'#ffae4a',w*.6));A_('sk4','stop-color',mixC(c4,'#fff0b8',w*.7));
 const sy=S.sunY-w*10;A_('sunDisc','cy',f1(sy));A_('sunDisc','r',f1(66+w*10));A_('sunHalo','cy',f1(sy));A_('sunHalo','r',f1(520+w*160));A_('sunHalo','opacity',f1(.9+w*.1));
 document.querySelectorAll('#rays polygon').forEach((p,i)=>{p.setAttribute('transform',`rotate(${f1(-38+i*13+Math.sin(t*.25+i)*2)} ${SUNX} ${f1(sy)})`);p.setAttribute('opacity',f1(.25+.2*Math.sin(t*.5+i*1.3)+w*.25))});
 document.querySelectorAll('#clouds g').forEach(g=>{const s=+g.dataset.s,ci=+g.dataset.ci;const x=((s*1400+t*(5+ci*2.2))%1500)-260;g.setAttribute('transform',`translate(${f1(x)} ${f1(+g.dataset.y)})`)});
 A_('boat','transform',`translate(${f1(820+Math.sin(t*.2)*30)} ${f1(1008+Math.sin(t*.9)*1.5)}) rotate(${f1(Math.sin(t*.9)*1.5)})`);
 A_('warmOv','opacity',f1(w*.35));A_('duskOv','opacity',f1(d*.18));
 updSea(t,sy);updShore(t);updPalms(t);updCrows(t);updDeco(t,w);
 // ----- figures -----
 const turn=sm(AN.turn0,AN.turn1,t),pre=t<AN.flash,swapK=sm(AN.swap-.3,AN.swap+.3,t),post=t>=AN.swap-.3;
 A_('standRear','opacity',f1(pre?(1-turn):0));A_('standProf','opacity',f1(pre?turn:(post?swapK:0)));
 TR('standRear',`translate(668 1548) scale(${f1(.95*(1-.34*turn))} .95)`);
 TR('standProf',`translate(664 1548) scale(${f1(.95*(.66+.34*turn))} .95)`);
 const face={smile:S.smile,lid:S.lid,brow:S.brow,gx:S.gx,gy:S.gy,browLift:S.browLift,glow:S.glow*S.phone,cheek:0};
 if(pre&&t<AN.turn1+.1)updRear(t);
 if((pre&&t>=AN.turn0-.1)||post)updProf(t,face,S.phone,S.phoneHold);
 const memo=t>=AN.flash&&t<AN.swap+.4;
 A_('seatG','opacity',memo?f1(1-swapK):0);A_('otherG','opacity',f1(S.otherA*(memo?1-swapK:0)));
 TR('seatG','translate(646 1566) scale(.82)');TR('otherG',`translate(${f1(742+Math.sin(t*.7)*1)} 1558) scale(.78)`);
 if(memo){updSeat('st_',t,{smile:S.smile,lid:S.lid,brow:S.brow,gx:S.gx,gy:S.gy,browLift:0,glow:0,cheek:0},'phone',1);
  if(S.otherA>.01)updSeat('ot_',t,{smile:.75,lid:.12,brow:0,gx:-1.5,gy:0,browLift:0,glow:0,cheek:.15},'rest',.72)}
 const sh=$('shadows');
 sh.innerHTML=memo?`<ellipse cx="780" cy="1574" rx="${f1(230+S.otherA*50)}" ry="20" fill="#3a2418" opacity="${f1(.3*(1-swapK))}" filter="url(#b4)"/>`:`<ellipse cx="780" cy="1552" rx="${f1(150+turn*20)}" ry="16" fill="#3a2418" opacity=".3" filter="url(#b4)"/>`;
 A_('prints','opacity',f1(pre?.35:0));
 A_('flash','opacity',f1(S.flash));
 updCaps(t);
}
window.DURATION=DUR;
window.seek=function(t){t=Math.max(0,Math.min(DUR,t));tl.time(t,false);proc(t);return t};
window.__ready=(async()=>{try{await document.fonts.load('800 68px NotoMal','അങ്ങനെ കിടക്കട്ടെ');await document.fonts.load('700 31px NotoMal','അ');await document.fonts.ready}catch(e){}
 layoutCaptions();window.seek(0);return true})();
</script>
